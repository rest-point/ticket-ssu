        "responses": {
          "200": {
            "description": "성공",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Session"
                },
                "example": {
                  "user": null,
                  "csrf": null,
                  "demo": true
                }
              }
            }
          },
          "403": {
            "description": "출처·프록시·CSRF·권한 검사 실패",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": "허용되지 않은 요청입니다."
                }
              }
            }
          },
          "429": {
            "description": "IP/회원 요청 제한·인증 시도 제한 또는 큐/제한 키 상한. Retry-After 초 뒤 재시도.",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "string",
                  "pattern": "^[1-9][0-9]*$"
                },
                "description": "최소 재시도 대기 초"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
                  "error": "요청이 너무 많습니다. 잠시 후 다시 이용해 주세요."
                }
              }
            }
          },
          "500": {
            "description": "예상하지 못한 오류. 현재 SQLITE_BUSY도 일반 500일 수 있음",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                },
                "example": {
